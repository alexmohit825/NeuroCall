name: Simulator Build Validation

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build for iOS simulator
        run: |
          xcodebuild -project RadixApp.xcodeproj \
                     -scheme RadixApp \
                     -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
                     clean build
        working-directory: RadixApp

      - name: Run unit tests (optional)
        run: |
          xcodebuild test -workspace RadixApp.xcworkspace \
                         -scheme RadixApp \
                         -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
                         -enableCodeCoverage YES
        working-directory: RadixApp
        continue-on-error: true

      - name: Archive build logs
        if: always()
        run: |
          mkdir -p ${{ runner.temp }}/logs
          cp -R ~/Library/Logs/xcodebuild ${{ runner.temp }}/logs || true
        shell: bash

      - name: Upload build logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build-logs
          path: ${{ runner.temp }}/logs
