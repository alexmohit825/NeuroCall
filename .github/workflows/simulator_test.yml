name: Simulator Build Validation

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen
        shell: bash
        # Generate Xcode project from project.yml
      - name: Generate Xcode project
        run: xcodegen generate
        shell: bash
        working-directory: .

      - name: Build for iOS simulator
        run: |
          xcodebuild -project Trephine.xcodeproj \
                     -scheme Trephine \
                     -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
                     clean build
        working-directory: .

      - name: Run unit tests (optional)
        run: |
          xcodebuild test -project Trephine.xcodeproj \
                         -scheme Trephine \
                         -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" \
                         -enableCodeCoverage YES
        working-directory: .
        continue-on-error: true

      - name: Archive build logs
        if: always()
        run: |
          mkdir -p ${{ runner.temp }}/logs
          cp -R ~/Library/Logs/xcodebuild ${{ runner.temp }}/logs || true
        shell: bash

      - name: Upload build logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build-logs
          path: ${{ runner.temp }}/logs
