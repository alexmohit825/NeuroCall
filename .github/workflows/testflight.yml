name: NeuroCall PC-to-TestFlight Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deliver:
    name: 🍏 Compile, Package & Deliver NeuroCall to TestFlight
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode 26.x (iOS 26+ SDK)
        run: |
          echo "Selecting Xcode 26.x..."
          sudo xcode-select -s /Applications/Xcode_26.3.0.app || sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
          xcrun simctl list > /dev/null || true

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project with Dynamic Build Number
        run: |
          BUILD_NUM=$(( ${{ github.run_number }} + 25 ))
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" Info.plist || true
          xcodegen generate

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: 🧪 Validate Apple API Key Connection
        run: |
          xcrun altool --list-apps \
            --apiKey 38F6WA87DU \
            --apiIssuer 73c7355a-beef-4d79-919d-c3d7dec7747a

      - name: 🚀 Archive Release Candidate for App Store
        run: |
          mkdir -p build/archive
          xcodebuild archive \
            -project NeuroCall.xcodeproj \
            -scheme NeuroCall \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/archive/NeuroCall.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📦 Export Signed IPA Package
        run: |
          mkdir -p build/output
          xcodebuild -exportArchive \
            -archivePath build/archive/NeuroCall.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: 🚀 Deliver to TestFlight via Apple altool
        run: |
          IPA_PATH=$(find build/output -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ Error: No .ipa found in build/output!"
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey 38F6WA87DU \
            --apiIssuer 73c7355a-beef-4d79-919d-c3d7dec7747a
          echo "=========================================================="
          echo "🎉 NeuroCall Build Successfully Delivered to Apple TestFlight!"
          echo "Target Bundle: com.AlexMohit.Trephine"
          echo "=========================================================="
