name: Build and Deploy to TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane -NV

      - name: Install CocoaPods
        run: pod install --repo-update
        working-directory: RadixApp

      - name: Build Archive
        run: |
          xcodebuild -scheme RadixApp -configuration Release -archivePath ${{ runner.temp }}/RadixApp.xcarchive clean archive
        working-directory: RadixApp

      - name: Export IPA
        run: |
          xcodebuild -exportArchive -archivePath ${{ runner.temp }}/RadixApp.xcarchive -exportOptionsPlist ./ExportOptions.plist -exportPath ${{ runner.temp }}
        working-directory: RadixApp

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f ${{ runner.temp }}/RadixApp.ipa \
            -t ios -u ${{ secrets.APP_STORE_CONNECT_API_USERNAME }} \
            --apiKey $APP_STORE_CONNECT_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID \
            --apiKeyPath <(echo "$APP_STORE_CONNECT_PRIVATE_KEY")
        working-directory: RadixApp
