name: NeuroCall PC-to-TestFlight Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_description:
        description: 'TestFlight Build Description'
        required: false
        default: 'Manual Release Dispatch'

concurrency:
  group: 'testflight'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deliver:
    name: 🍏 Compile, Archive & Deliver to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode 26.x (iOS 26+ SDK)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_26.3.0.app || sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          xcrun simctl list devices > /dev/null 2>&1 || true

      - name: ⚙️ Install XcodeGen
        run: brew install xcodegen

      - name: 🏗️ Generate Native Xcode Project with Dynamic Build Number
        run: |
          BUILD_NUM=${{ github.run_number }}
          echo "Setting CURRENT_PROJECT_VERSION to $BUILD_NUM"
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml
          xcodegen generate --spec project.yml

      - name: 🔑 Configure App Store Connect API Credentials
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf "%s\n" "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "✓ App Store Connect API Key installed successfully."

      - name: 🧪 Validate Apple API Key Connection
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          echo "Testing connection to Apple App Store Connect..."
          xcrun altool --list-apps \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: 🚀 Archive Release Candidate for TestFlight
        run: |
          mkdir -p build/archive
          xcodebuild archive \
            -project NeuroCall.xcodeproj \
            -scheme NeuroCall \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/archive/NeuroCall.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📤 Export & Deliver to TestFlight via Apple Direct Upload
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          mkdir -p build/output
          echo "Uploading archive directly to App Store Connect via native xcodebuild distribution..."
          xcodebuild -exportArchive \
            -archivePath build/archive/NeuroCall.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/output \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          
          echo "=========================================================="
          echo "🎉 NeuroCall Build Successfully Delivered to Apple TestFlight!"
          echo "Target Bundle: com.AlexMohit.Trephine"
          echo "App Store Connect is processing the build for your iPhone."
          echo "=========================================================="
