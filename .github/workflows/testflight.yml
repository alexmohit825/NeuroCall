name: NeuroCall PC-to-TestFlight Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_description:
        description: 'TestFlight Build Description'
        required: false
        default: 'Manual Release Dispatch'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deliver:
    name: 🍏 Compile, Package & Deliver NeuroCall to TestFlight
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Select Xcode 16.x (iOS 18+ SDK)
        run: |
          echo "Selecting Xcode default image..."
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: 🔑 Import Apple App Store Connect API Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: 📦 Install XcodeGen & Generate .xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: 🔢 Compute Dynamic Build Number
        id: build_number
        run: |
          BUILD_NUM=${{ github.run_number }}
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Computed TestFlight Build Number: $BUILD_NUM"

      - name: 🏗️ Archive NeuroCall for App Store Connect
        env:
          BUILD_NUM: ${{ steps.build_number.outputs.build_num }}
        run: |
          xcodebuild archive \
            -project NeuroCall.xcodeproj \
            -scheme NeuroCall \
            -destination "generic/platform=iOS" \
            -archivePath build/NeuroCall.xcarchive \
            CURRENT_PROJECT_VERSION=$BUILD_NUM \
            MARKETING_VERSION=1.0.0 \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=523MJL63MC \
            -allowProvisioningUpdates \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: 📤 Export & Upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/NeuroCall.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID 38F6WA87DU \
            -authenticationKeyIssuerID 73c7355a-beef-4d79-919d-c3d7dec7747a \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
