name: Radix
options:
  bundleIdPrefix: com.AlexMohit
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: Radix
    PRODUCT_BUNDLE_IDENTIFIER: com.AlexMohit.RadixNeuro
    DEVELOPMENT_TEAM: "523MJL63MC"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Radix:
    type: application
    platform: iOS
    sources:
      - path: RadixApp
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.AlexMohit.RadixNeuro
        PRODUCT_NAME: Radix
        INFOPLIST_FILE: Info.plist
