<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="url(#cyanViolet)" stroke-width="4" stroke-opacity="0.3" fill="none" />

  <!-- Spinal Cord Vertical Axis (Dorsal Horns & Ventral Columns) -->
  <g filter="url(#glow)">
    <line x1="256" y1="80" x2="256" y2="432" stroke="#4f46e5" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round" />
    
    <!-- Central Canal & Spinal Cord Nodes -->
    <circle cx="256" cy="140" r="14" fill="#312e81" stroke="#818cf8" stroke-width="4" />
    <circle cx="256" cy="256" r="22" fill="#1e1b4b" stroke="#a855f7" stroke-width="6" />
    <circle cx="256" cy="372" r="14" fill="#312e81" stroke="#818cf8" stroke-width="4" />
  </g>

  <!-- Radicular Roots Branching Out (Spinal Root vs Peripheral Bifurcation) -->
  <!-- Left Side: Dorsal Sensory Root (Cyan) -->
  <path d="M 256 256 C 180 230, 130 170, 90 190" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="90" cy="190" r="12" fill="#0891b2" stroke="#67e8f9" stroke-width="4" />
  <path d="M 90 190 Q 60 160, 48 130" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" />
  <path d="M 90 190 Q 50 200, 42 220" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" />

  <!-- Right Side: Ventral Motor Root (Violet / Indigo) -->
  <path d="M 256 256 C 332 230, 382 170, 422 190" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="422" cy="190" r="12" fill="#9333ea" stroke="#d8b4fe" stroke-width="4" />
  <path d="M 422 190 Q 452 160, 464 130" fill="none" stroke="#c084fc" stroke-width="5" stroke-linecap="round" />
  <path d="M 422 190 Q 462 200, 470 220" fill="none" stroke="#c084fc" stroke-width="5" stroke-linecap="round" />

  <!-- Peripheral Nerve Trunk / Cauda Equina Descent -->
  <path d="M 256 256 C 210 330, 160 380, 120 420" fill="none" stroke="#06b6d4" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 8" />
  <path d="M 256 256 C 302 330, 352 380, 392 420" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round" stroke-dasharray="10 8" />

  <!-- The Radix Central Core Symbol (Dorsal Root Ganglion DRG Spark) -->
  <circle cx="256" cy="256" r="10" fill="#38bdf8" />
  <circle cx="256" cy="256" r="5" fill="#ffffff" />

  <!-- Dynamic Conflict Solver Crosshair / Spark Indicator -->
  <polygon points="256,76 264,96 284,104 264,112 256,132 248,112 228,104 248,96" fill="url(#amberGlow)" filter="url(#glow)" />
</svg>